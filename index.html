<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 30px 15px; display: flex; justify-content: center; }
    .box { background: #fff; width: 100%; max-width: 520px; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { text-align: center; color: #0f172a; margin-top: 0; }
    .row { display: flex; gap: 8px; }
    .row input, .row select { padding: 10px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    .row input { flex: 1; min-width: 0; }
    button { padding: 10px 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-weight: bold; }
    .filters { display: flex; gap: 6px; margin: 14px 0; }
    .filters button { background: #e2e8f0; color: #0f172a; flex: 1; }
    .filters button.active { background: #0f172a; color: #fff; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #94a3b8; }
    .del { background: #dc2626; padding: 6px 10px; }
    .High { color: #dc2626; } .Medium { color: #d97706; } .Low { color: #16a34a; }
    .count { text-align: center; color: #64748b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Task Manager</h1>
    <div class="row">
      <input id="taskInput" type="text" placeholder="Add a new task">
      <select id="priority">
        <option>High</option><option selected>Medium</option><option>Low</option>
      </select>
      <button onclick="addTask()">Add</button>
    </div>
    <div class="filters">
      <button data-f="all" onclick="setFilter('all')">All</button>
      <button data-f="active" onclick="setFilter('active')">Active</button>
      <button data-f="done" onclick="setFilter('done')">Done</button>
    </div>
    <ul id="list"></ul>
    <div class="count" id="count"></div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let filter = "all";

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) { alert("Please enter a task"); return; }
      tasks.push({ id: Date.now(), text: text, priority: document.getElementById("priority").value, done: false });
      input.value = "";
      save();
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      save();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
    }

    function setFilter(f) {
      filter = f;
      render();
    }

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      render();
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      const shown = tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));

      shown.forEach(t => {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        li.innerHTML =
          '<input type="checkbox" ' + (t.done ? "checked" : "") + ' onchange="toggleTask(' + t.id + ')">' +
          '<span></span>' +
          '<b class="' + t.priority + '">' + t.priority + '</b>' +
          '<button class="del" onclick="deleteTask(' + t.id + ')">Delete</button>';
        li.querySelector("span").textContent = t.text;
        list.appendChild(li);
      });

      document.querySelectorAll(".filters button").forEach(b => {
        b.classList.toggle("active", b.dataset.f === filter);
      });
      const left = tasks.filter(t => !t.done).length;
      document.getElementById("count").textContent = left + " task(s) left";
    }

    document.getElementById("taskInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    render();
  </script>
</body>
</html>
